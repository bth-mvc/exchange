openapi: '3.1.0'
info:
  title: BTH Exchange
  description: |
    Tokenbörsen för MVC-kursen vid BTH.

    Rate limit: högst 120 anrop per minut och API-nyckel. Över gränsen svarar börsen 429 med
    `Retry-After` (sekunder tills fönstret öppnar igen).
  version: '1.5.1'

servers:
  - url: /
    description: Samma server som visar dokumentationen

security:
  - apiKey: []

tags:
  - name: assets
    description: Tokens och orderbok
  - name: orders
    description: Lägg ordrar
  - name: trades
    description: Handelshistorik
  - name: portfolio
    description: Portfölj
  - name: leaderboard
    description: Rankningslista
  - name: market
    description: SSE market feed

paths:
  /health:
    get:
      summary: Hälsostatus
      security: []
      responses:
        '200':
          description: OK

  /assets:
    get:
      tags: [assets]
      summary: Lista alla tokens med aktuellt pris
      responses:
        '200':
          description: Lista med tokens
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /assets/{id}/orderbook:
    get:
      tags: [assets]
      summary: Orderbok för en specifik token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: FIKA
      responses:
        '200':
          description: |
            Orderbok med bids (högst pris först) och asks (lägst pris först), högst tio nivåer
            per sida, aggregerade per pris. `marketMaker` är sann när Marvin har en order på nivån.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orderbook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{id}/history:
    get:
      tags: [assets]
      summary: Prishistorik för en token
      description: |
        Punkter äldst först, för att rita en graf. `10m` ger varje sparat pris (var 10:e sekund)
        de senaste tio minuterna, `1d` det sista priset i varje femminutersperiod det senaste
        dygnet och `30d` stängningspriset per dag (dagens hittills), där `timestamp` är datumet.
        Stora nyheter för samma period finns i `GET /market/news?impact=big`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: YOLO
        - name: range
          in: query
          schema:
            type: string
            enum: [10m, 1d, 30d]
            default: 1d
      responses:
        '200':
          description: Prispunkter
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: YOLO
                  range:
                    type: string
                    example: 1d
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          example: '2026-10-28T12:05:00.000Z'
                        price:
                          type: number
                          example: 4.31
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders:
    post:
      tags: [orders]
      summary: Lägg en order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, side, amount, price]
              properties:
                token:
                  type: string
                  example: FIKA
                side:
                  type: string
                  enum: [buy, sell]
                amount:
                  type: integer
                  minimum: 1
                  example: 10
                price:
                  type: number
                  example: 10.50
                userId:
                  type: string
                  example: user-123
      responses:
        '201':
          description: >-
            Order lagd. Matchas direkt mot motpart om möjligt (helt eller
            delvis), annars ligger den öppen i orderboken tills en motpart
            eller likviditetsbotten fyller den.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [orders]
      summary: Egna ordrar med status, nyast först
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, filled, cancelled]
            default: open
      responses:
        '200':
          description: 'Upp till 100 ordrar: [{ id, userId?, token, side, amount, remaining, price, status, createdAt }]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{id}:
    delete:
      tags: [orders]
      summary: Avbryt en egen öppen order
      description: |
        Den del som inte fyllts släpps (reservationen av saldo eller tokens försvinner), och en
        `order.cancelled`-webhook läggs i kön.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Den avbrutna ordern: { id, token, side, amount, remaining, price, status: "cancelled", createdAt }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ordern är inte öppen (redan fylld eller avbruten)
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /trades:
    get:
      tags: [trades]
      summary: Handelshistorik med cursor-paginering
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista med trades och nästa cursor
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /portfolio:
    get:
      tags: [portfolio]
      summary: Studentens portfölj
      responses:
        '200':
          description: Balans, holdings och totalvärde
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /leaderboard:
    get:
      tags: [leaderboard]
      summary: Rankningslista sorterad på portföljvärde
      description: |
        Alla, även Marvin (`marketMaker: true`). Varje post: `rank`, `acronym`, `marketMaker`,
        `totalValue`, `buys`, `sells`, `turnover` (summan av alla affärers belopp, köp plus
        sälj), `lastTradeAt`, `registeredAt`.

        Med `since` räknas `buys`, `sells` och `turnover` bara från den dagen, och varje post
        får `startValue` (värdet när dagen började, eller startkapitalet 100 000 för den som
        kom senare) och `changePct`. Listan rankas då på `changePct`, t.ex. för en veckoliga.
      parameters:
        - name: since
          in: query
          description: Datum, YYYY-MM-DD (UTC)
          schema:
            type: string
            format: date
          example: '2026-10-26'
      responses:
        '200':
          description: Rankad lista med alla studenter
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /market/feed:
    get:
      tags: [market]
      summary: SSE market feed
      description: |
        Server-Sent Events stream. Events: `connected`, `price`, `trade`, `orderbook`, `news`.
        `trade` har `buyOrderId` och `sellOrderId`, så att en server känner igen sina egna affärer.
        `orderbook` har samma form som `GET /assets/{id}/orderbook` plus `timestamp`, och skickas
        när en tokens orderbok har ändrats (som oftast en gång i sekunden per token).
        `news` har samma form som en post i `GET /market/news`.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /market/news:
    get:
      tags: [market]
      summary: Sparade nyheter, nyast först
      description: |
        Samma poster som `news`-eventet i feeden. Vanliga nyheter (`low`/`medium`/`high`) sparas
        ett dygn, rykten (`rumor`) och stora händelser (`big`) i 60 dagar, så att en graf kan
        visa dem som markörer.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - name: token
          in: query
          schema:
            type: string
          example: YOLO
        - name: impact
          in: query
          description: Kommaseparerad lista, t.ex. `big` eller `rumor,big`
          schema:
            type: string
          example: big
      responses:
        '200':
          description: Nyheter, nyast först
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/News'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks/secret:
    get:
      tags: [webhooks]
      summary: Studentens webhook-hemlighet
      description: |
        Den delade hemligheten som varje webhook signeras med (HMAC-SHA256).
        Skapas första gången studenten används och ändras inte.
      responses:
        '200':
          description: '{ "secret": "whsec_..." }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks/pending:
    get:
      tags: [webhooks]
      summary: Webhooks som inte är kvitterade, äldst först
      description: |
        Börsen pushar inga webhooks; studentens server pollar här. Varje post har
        `body` (exakt den sträng som signerats), `signature` (`sha256=<hex>`, samma
        värde som headern `X-Webhook-Signature` vid push) och `id`. En post
        returneras tills den kvitterats med POST /webhooks/pending/ack.
        Event: `order.filled` (en fyllnad; `remaining` och `status` visar om ordern är helt
        fylld eller fortfarande öppen) och `order.cancelled` (ordern avbröts).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: '{ "webhooks": [{ "id": "wh-...", "body": "{...}", "signature": "sha256=..." }] }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks/pending/ack:
    post:
      tags: [webhooks]
      summary: Kvittera hanterade webhooks
      description: Okända id:n och andra studenters id:n ignoreras.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: '{ "acked": <antal> }'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Studentens API-nyckel. Kan även skickas som query-parameter: ?api_key=<key>'

  schemas:
    BookLevel:
      type: object
      properties:
        price:
          type: number
          example: 10.2
        amount:
          type: integer
          example: 490
        side:
          type: string
          enum: [buy, sell]
        marketMaker:
          type: boolean
          example: true
    Orderbook:
      type: object
      properties:
        token:
          type: string
          example: FIKA
        bids:
          type: array
          items:
            $ref: '#/components/schemas/BookLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/BookLevel'

    News:
      type: object
      required: [id, token, sentiment, impact, headline, timestamp]
      properties:
        id:
          type: string
          example: news-1793227891411-p7
        token:
          type: string
          example: HODL
        sentiment:
          type: string
          enum: [positive, negative, neutral]
        impact:
          type: string
          enum: [low, medium, high, rumor, big]
          description: |
            `low`/`medium`/`high` knuffar priset ca 1/2/3 % i några sekunder, sedan dras det
            tillbaka. `rumor` kommer några minuter före en stor händelse och har rätt riktning i
            ca 75 % av fallen. `big` flyttar priset och dess nivå 10–25 % under en ramp.
        headline:
          type: string
          example: 'BREAKING: HODL becomes official payment option at a big retailer'
        pct:
          type: number
          description: Bara för `big`, planerad förändring i procent
          example: 24.3
        durationSec:
          type: integer
          description: Bara för `big`, hur länge rampen pågår
          example: 180
        timestamp:
          type: string
          format: date-time

  responses:
    TooManyRequests:
      description: För många anrop — vänta det antal sekunder som Retry-After anger
      headers:
        Retry-After:
          description: Sekunder tills rate limit-fönstret öppnar igen
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Too many requests
    Unauthorized:
      description: Ogiltig eller saknad API-nyckel
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    BadRequest:
      description: Ogiltig request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resursen hittades inte
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
