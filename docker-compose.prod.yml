services:
  exchange:
    image: ghcr.io/bth-mvc/exchange:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - ./data:/app/data
    env_file: .env.docker
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://localhost:'+(process.env.PORT||4000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
